<svg class="intro-map" viewBox="0 0 620 490" role="img" aria-labelledby="intro-map-title intro-map-desc">
  <title id="intro-map-title">Mesopotamia: schematic regional map</title>
  <desc id="intro-map-desc">Shading marks the approximate region of known bowl finds, from Ashur in northern Iraq to the river confluence in the south and Khuzestan in southwestern Iran. Nippur is marked for orientation. This schematic shows a broad region, not exact findspots.</desc>
  <defs><pattern id="map-grid" width="62" height="49" patternUnits="userSpaceOnUse"><path d="M62 0H0V49" fill="none" stroke="#a89a7b" stroke-width=".5" opacity=".25"/></pattern></defs>
  <rect class="intro-map-ground" width="620" height="490" fill="#191b1a"/>
  <rect width="620" height="490" fill="url(#map-grid)"/>
  <path class="intro-map-corridor" d="M350 35l32 32 10 40 40 27 18 49 46 35 19 55 47 31" fill="none" stroke="#2d302d" stroke-width="42" opacity=".55"/>
  <path class="intro-find-region" d="M219 61C252 48 284 87 300 126S335 190 374 215S458 224 475 273S461 343 414 369C377 375 327 349 286 317S219 261 202 221S175 151 182 117S200 76 219 61Z" fill="#d9954f" fill-opacity=".23" stroke="#d9954f" stroke-opacity=".65" stroke-width="1.5" stroke-dasharray="5 5"/>
  <path class="intro-map-water" d="M408 365Q440 350 452 375T492 403L620 444V490H475Q465 450 442 430T408 365" fill="#28464a"/>
  <g class="intro-map-rivers" fill="none" stroke="#6d9da2" stroke-width="3">
    <path d="M115 42Q74 89 121 120T168 180T204 236T256 287T304 324T412 378"/>
    <path d="M244 24Q211 70 258 110T281 174T311 236T344 297T400 350L412 378"/>
  </g>
  <g class="intro-map-labels" fill="#bcb2a3">
    <text x="77" y="269" letter-spacing="5">IRAQ</text><text x="443" y="190" letter-spacing="5">IRAN</text>
    <text x="191" y="213" transform="rotate(42 191 213)" font-size="11" letter-spacing="3">MESOPOTAMIA</text>
    <text x="82" y="166" font-size="12">Euphrates</text><text x="297" y="126" font-size="12">Tigris</text>
    <text x="475" y="454" font-size="12">Persian Gulf</text>
    <circle cx="281" cy="294" r="12" fill="none" stroke="#d9954f"/><circle cx="281" cy="294" r="4" fill="#d9954f"/>
    <circle cx="226" cy="81" r="3" fill="#d9954f"/><text x="241" y="83" font-size="12">Ashur</text><text x="388" y="291" font-size="12">Khuzestan</text>
    <text x="223" y="334" font-size="15">Nippur</text>
    <path d="M555 82V48m-5 9 5-9 5 9" fill="none" stroke="#bcb2a3"/><text x="550" y="39" font-size="12">N</text>
  </g>
