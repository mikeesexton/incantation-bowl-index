# Cloudflare Pages project for bowlam.com.
#
# Scope note: this config deploys `site/public` — the generated landing page —
# and nothing else. The research console in `web/` is localhost-only and must
# never be deployed (docs/project-rules.md §3). That is why the public artefact
# lives in its own directory with its own config, rather than as a flag on the
# console's build.

name = "bowlam"
compatibility_date = "2026-09-19"
pages_build_output_dir = "public"

# Created 19 September 2026 with `npx wrangler d1 create bowlam-interest`.
# The binding stays `DB` because functions/api/interest.js reads env.DB;
# Wrangler's suggested `bowlam_interest` would silently 503 the signup form.
[[d1_databases]]
binding = "DB"
database_name = "bowlam-interest"
database_id = "530d00fb-b954-4d51-ae5a-6e4c5fdc7d24"
