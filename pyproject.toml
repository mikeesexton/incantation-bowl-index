[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "incantation-bowl-index"
version = "0.1.0"
description = "Evidence-first research corpus for ancient incantation bowls"
requires-python = ">=3.9"
dependencies = ["pypdf>=4"]

[project.scripts]
ibi = "bowl_index.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
